<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive | The Clearing</title><style>body{margin:0;background:#f8f5ed;color:#303b39;font:16px/1.6 system-ui,sans-serif}header{background:#086788;color:white;padding:24px}header a{color:white}h1{font:italic 40px Georgia;margin:0}main{max-width:900px;margin:auto;padding:24px}button,input,select{font:inherit;padding:8px;border-radius:4px}button{background:#174e52;color:white;border:0;cursor:pointer}button.delete{background:#963c60}button:disabled{opacity:.5}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fffdf8;padding:14px;margin:8px 0}.row div{flex:1;min-width:150px;overflow-wrap:anywhere}small{display:block} [hidden]{display:none!important}</style><link rel="stylesheet" href="./clearing-shell.css"><style>*{box-sizing:border-box}.row{background:white;border:1px solid #deddd4;border-radius:4px}button.delete{background:#982e3d}</style><script defer src="./clearing-shell.js"></script></head><body><main><header><div class="eyebrow">YOUR WORKSPACE / ARCHIVE</div><h1>The Archive</h1><div>Out of sight, not lost.</div></header><p id="status" role="status">Connecting…</p><a id="login" href="./workspace.html" hidden>Sign in</a><section id="app" hidden><p>Archived items stay here until you restore or permanently delete them. Restored tasks become open, projects active, and captures unprocessed.</p><label>Type <select id="type"><option value="">Everything</option><option>Tasks</option><option>Projects</option><option>Notes</option><option>Lists</option><option>Inbox</option></select></label> <input id="search" type="search" placeholder="Search archive" aria-label="Search archive"><div id="rows"></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://iifnugidzlgjsbfoapyy.supabase.co','sb_publishable_8IJB5S4tw4eesYAF5NNFmQ_xEepjsRf');
const $=id=>document.getElementById(id), configs=[['tasks','Tasks','title','status','archived','open'],['projects','Projects','name','status','archived','active'],['notes','Notes','title','archived',true,false],['lists','Lists','name','archived',true,false],['inbox','Inbox','content','status','archived','unprocessed']];let owner=null,version=0,rows=[],busy=false;const check=r=>{if(r.error)throw r.error;return r.data};const el=(tag,t)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n};
async function load(){const v=version,u=owner;const results=await Promise.all(configs.map(async c=>check(await db.from(c[0]).select(c[0]==='notes'?'id,title,content':'id,'+c[2]).eq('user_id',u).eq(c[3],c[4])).map(x=>({id:x.id,title:x[c[2]]||x.content?.slice(0,80)||'Untitled',c}))));if(v!==version)return;rows=results.flat();draw();$('status').textContent='Private archive'}
function draw(){const root=$('rows');root.replaceChildren();const q=$('search').value.toLowerCase(),type=$('type').value;for(const x of rows.filter(x=>(!type||x.c[1]===type)&&x.title.toLowerCase().includes(q))){const r=el('div');r.className='row';const label=el('div',x.title);label.append(el('small',x.c[1]));const restore=el('button','Restore'),del=el('button','Delete');del.className='delete';restore.onclick=()=>act(x,false);del.onclick=()=>act(x,true);r.append(label,restore,del);root.append(r)}if(!root.children.length)root.textContent='Nothing here.'}
async function act(x,remove){if(busy||!owner)return;if(remove&&!confirm('Permanently delete this item? '+(x.c[0]==='lists'?'All its list items will also be deleted. ':x.c[0]==='projects'?'Associated tasks and notes will be retained. ':'')+'This cannot be undone in The Clearing.'))return;busy=true;const u=owner,v=version;try{const q=remove?db.from(x.c[0]).delete():db.from(x.c[0]).update({[x.c[3]]:x.c[5]});check(await q.eq('id',x.id).eq('user_id',u).eq(x.c[3],x.c[4]).select('id').single());if(v===version)await load()}catch(e){if(v===version)$('status').textContent=e.message}finally{busy=false}}
$('search').oninput=draw;$('type').onchange=draw;db.auth.onAuthStateChange((_e,s)=>setTimeout(()=>{const next=s?.user?.id||null;if(next===owner&&next)return;owner=next;version++;rows=[];$('rows').replaceChildren();$('app').hidden=!owner;$('login').hidden=!!owner;$('status').textContent=owner?'Loading…':'Signed out.';if(owner)load().catch(e=>$('status').textContent=e.message)},0));
</script></body></html>
