<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Projects | The Clearing</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ed;color:#303b39;font:16px/1.6 system-ui,sans-serif}header{background:#086788;color:white;padding:24px max(20px,calc((100vw - 1100px)/2))}header h1{font:italic 40px Georgia,serif;margin:0}header a{color:white}main{max-width:1100px;margin:auto;padding:24px}button,input,select,textarea{font:inherit;padding:9px;border-radius:4px}button{background:#174e52;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}input,select,textarea{border:1px solid #87948d;background:white;color:#303b39;max-width:100%}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #963c60;outline-offset:3px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.layout{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.5fr);gap:24px;margin-top:20px}.entry{display:block;width:100%;text-align:left;background:#e1edf0;color:#174e52;margin:8px 0;padding:14px;overflow-wrap:anywhere}.entry[aria-current=true]{border-left:5px solid #086788;background:#e7edda}.entry small{display:block}.paper{background:#fffdf8;padding:24px;border-top:4px solid #8cbf40;min-width:0}.paper label{display:block;margin:8px 0}.wide{width:100%}textarea{min-height:90px;resize:vertical}.resume{background:#eee5d8;padding:16px;margin:16px 0}.muted{font-size:14px;color:#59645e}h2,h3{color:#174e52}.task{display:flex;gap:8px;align-items:center;border-bottom:1px solid #ddd;padding:8px 0}.task span{overflow-wrap:anywhere}.task input{flex:none}[hidden]{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}main{padding:14px}.paper{padding:16px}}
#notes details{padding:12px;background:#e7edda;margin:10px 0}#notes summary{cursor:pointer;font-weight:600}#notes form{display:grid;gap:8px;margin:12px 0}#notes form button{justify-self:start}</style></head><body><header><a href="./workspace.html">← Command Central</a> · <a href="./archive.html">Archive</a><h1>Projects &amp; Responsibilities</h1><div>Pick up where you left off.</div></header><main><p id="status" role="status">Connecting…</p><a id="login" href="./workspace.html" hidden>Sign in</a><div id="app" hidden><div class="toolbar"><button id="new">+ New project</button><label>Workspace <select id="scope"><option value="all">Everything</option><option value="work">Work</option><option value="personal">Personal</option></select></label><label>Status <select id="filter"><option value="current">Active &amp; paused</option><option value="all">All</option><option value="completed">Completed</option><option value="archived">Archived</option></select></label></div><div class="layout"><aside><input id="search" type="search" placeholder="Find a project…" aria-label="Search projects" class="wide"><div id="list"></div></aside><section class="paper" id="editor" hidden><h2 id="heading">Project</h2><form id="form"><label>Name<input class="wide" name="name" required></label><div class="toolbar"><label>Type <select name="project_type"><option value="project">Project</option><option value="ongoing">Ongoing responsibility</option></select></label><label>Workspace <select name="workspace"><option value="personal">Personal</option><option value="work">Work</option></select></label><label>Status <select name="status"><option value="active">Active</option><option value="paused">Paused</option><option value="completed">Completed</option><option value="archived">Archived</option></select></label></div><label>Purpose / desired outcome<textarea class="wide" name="description"></textarea></label><div class="resume"><h3>Resume here</h3><label>Next action<input class="wide" name="next_action" placeholder="What should I do next?"></label><label>Where I left off<textarea class="wide" name="resume_notes" placeholder="Leave a message for your future self…"></textarea></label></div><div class="toolbar"><label>Target date (optional) <input type="date" name="target_date"></label><label><input type="checkbox" name="pinned"> Pin project</label></div><button>Save project</button> <button type="button" id="deleteProject">Delete project</button><span id="saved" class="muted" role="status"></span></form><div id="related" hidden><h3>Tasks</h3><div id="tasks"></div><form id="taskform" class="toolbar"><input name="title" required placeholder="Add a task…" aria-label="New project task"><button>Add</button></form><h3>Notes</h3><div id="notes"></div><form id="noteform" class="toolbar"><input class="wide" name="title" placeholder="Optional note title" aria-label="Note title"><textarea class="wide" name="content" placeholder="Write a note…" aria-label="Note content"></textarea><button>Save note</button></form></div></section></div></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://iifnugidzlgjsbfoapyy.supabase.co','sb_publishable_8IJB5S4tw4eesYAF5NNFmQ_xEepjsRf');
const $=id=>document.getElementById(id),form=$('form');let owner=null,rows=[],active=null,version=0,selection=0,dirty=false,busy=false;const check=r=>{if(r.error)throw r.error;return r.data};const err=e=>$('status').textContent=e.message||'Request failed';const el=(tag,t)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n};
function draw(){const q=$('search').value.toLowerCase(),s=$('scope').value,f=$('filter').value;const list=$('list');list.replaceChildren();for(const p of rows.filter(p=>(s==='all'||p.workspace===s)&&(f==='all'||(f==='current'?['active','paused'].includes(p.status):p.status===f))&&p.name.toLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||a.name.localeCompare(b.name))){const b=el('button',(p.pinned?'★ ':'')+p.name);b.className='entry';b.setAttribute('aria-current',String(active===p.id));b.append(el('small',p.workspace+' · '+(p.project_type==='ongoing'?'Ongoing': 'Project')+' · '+p.status));b.onclick=()=>{if(!busy&&leave())open(p.id)};list.append(b)}if(!list.children.length)list.textContent='No matching projects.'}
function leave(){return !dirty||confirm('Discard unsaved project changes?')}
async function load(){const v=version;const data=check(await db.from('projects').select('*').eq('user_id',owner));if(v!==version)return;rows=data;draw()}
function open(id){selection++;active=id;dirty=false;form.reset();const p=rows.find(x=>x.id===id);for(const k of ['name','project_type','workspace','status','description','next_action','resume_notes','target_date'])if(p)form.elements[k].value=p[k]||'';form.elements.pinned.checked=!!p?.pinned;if(!p&&$('scope').value==='work')form.elements.workspace.value='work';$('heading').textContent=p?.name||'New project';$('saved').textContent='';$('editor').hidden=false;$('related').hidden=!p;$('deleteProject').hidden=!p;$('tasks').replaceChildren();$('notes').replaceChildren();draw();if(p)related().catch(err);else form.elements.name.focus()}
async function related(){const v=version,s=selection,id=active;if(!id)return;const [t,n]=await Promise.all([db.from('tasks').select('id,title,status').eq('project_id',id).neq('status','archived').order('created_at'),db.from('notes').select('id,title,content').eq('project_id',id).eq('archived',false).order('updated_at',{ascending:false})]);if(v!==version||s!==selection)return;const tasks=check(t),notes=check(n);$('tasks').replaceChildren();$('notes').replaceChildren();for(const x of tasks){const l=el('label');l.className='task';const c=el('input');c.type='checkbox';c.checked=x.status==='completed';c.onchange=async()=>{c.disabled=true;try{check(await db.from('tasks').update({status:c.checked?'completed':'open'}).eq('id',x.id).eq('user_id',owner));await related()}catch(e){c.checked=!c.checked;err(e)}finally{c.disabled=false}};l.append(c,el('span',x.title));$('tasks').append(l)}for(const x of notes){const d=el('details');d.append(el('summary',x.title||x.content.slice(0,60)||'Untitled note'));const nf=el('form');const title=el('input');title.className='wide';title.value=x.title||'';title.setAttribute('aria-label','Note title');const body=el('textarea');body.className='wide';body.value=x.content;body.setAttribute('aria-label','Note content');const save=el('button','Save note');const status=el('span');status.setAttribute('role','status');const a=el('a','Open in Notebook');a.href='./notebook.html?note='+encodeURIComponent(x.id);nf.append(title,body,save,status);nf.onsubmit=e=>{e.preventDefault();action(async()=>{const v=version;save.disabled=true;try{const t=title.value.trim()||null,c=body.value;check(await db.from('notes').update({title:t,content:c}).eq('id',x.id).eq('user_id',owner).select('id').single());if(v!==version)return;d.querySelector('summary').textContent=t||c.slice(0,60)||'Untitled note';status.textContent=' Saved'}finally{save.disabled=false}})};d.append(nf,a);$('notes').append(d)}if(!tasks.length)$('tasks').textContent='No tasks yet.';if(!notes.length)$('notes').textContent='No notes yet.'}
async function action(fn){if(busy||!owner)return;busy=true;try{await fn()}catch(e){err(e)}finally{busy=false}}
form.addEventListener('input',()=>{dirty=true;$('saved').textContent='Unsaved changes'});form.onsubmit=e=>{e.preventDefault();action(async()=>{const v=version,id=active,data=Object.fromEntries(new FormData(form));data.name=data.name.trim();if(!data.name)return;data.target_date=data.target_date||null;data.pinned=form.elements.pinned.checked;const before=JSON.stringify(data);const p=check(await (id?db.from('projects').update(data).eq('id',id).eq('user_id',owner):db.from('projects').insert({...data,user_id:owner})).select().single());if(v!==version)return;await load();if(v!==version)return;const now=Object.fromEntries(new FormData(form));now.name=now.name.trim();now.target_date=now.target_date||null;now.pinned=form.elements.pinned.checked;if(JSON.stringify(now)===before){open(p.id);$('saved').textContent='Saved'}else{active=p.id;$('related').hidden=false;$('saved').textContent='New changes not saved';draw();await related()}})};
$('new').onclick=()=>{if(!busy&&leave())open(null)};for(const id of ['scope','filter','search'])$(id).addEventListener('input',draw);
$('taskform').onsubmit=e=>{e.preventDefault();action(async()=>{const v=version,p=rows.find(x=>x.id===active),title=e.target.elements.title.value.trim();if(!p||!title)return;check(await db.from('tasks').insert({title,project_id:p.id,workspace:p.workspace,user_id:owner}));if(v!==version)return;e.target.reset();await related()})};
$('noteform').onsubmit=e=>{e.preventDefault();action(async()=>{const v=version,p=rows.find(x=>x.id===active);if(!p)return;const title=e.target.elements.title.value.trim()||null,content=e.target.elements.content.value;if(!title&&!content.trim())return;check(await db.from('notes').insert({title,content,project_id:p.id,workspace:p.workspace,user_id:owner}));if(v!==version)return;e.target.reset();await related()})};
$('deleteProject').onclick=()=>{if(!active||!confirm('Permanently delete this project? Associated tasks, notes and priorities will remain.'))return;action(async()=>{const v=version;check(await db.from('projects').delete().eq('id',active).eq('user_id',owner).select('id').single());if(v!==version)return;dirty=false;active=null;$('editor').hidden=true;await load()})};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function show(session){const next=session?.user?.id||null;if(next===owner&&next)return;version++;selection++;owner=next;rows=[];active=null;dirty=false;form.reset();$('list').replaceChildren();$('tasks').replaceChildren();$('notes').replaceChildren();$('editor').hidden=true;$('app').hidden=!owner;$('login').hidden=!!owner;$('status').textContent=owner?'Private workspace':'Signed out.';if(owner)load().catch(err)}
db.auth.onAuthStateChange((_e,s)=>setTimeout(()=>show(s),0));
</script></body></html>
