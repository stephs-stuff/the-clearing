<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lists | The Clearing</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ed;color:#303b39;font:16px/1.6 system-ui,sans-serif}header{background:#086788;color:white;padding:24px max(20px,calc((100vw - 1000px)/2))}header a{color:white}h1{font:italic 40px Georgia,serif;margin:0}main{max-width:1000px;margin:auto;padding:24px}button,input,select,textarea{font:inherit;padding:9px;border-radius:4px;max-width:100%}button{background:#174e52;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}input,select,textarea{border:1px solid #87948d;background:white}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #963c60;outline-offset:3px}.layout{display:grid;grid-template-columns:1fr 2.5fr;gap:24px;margin-top:20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.entry{display:block;width:100%;text-align:left;background:#e1edf0;color:#174e52;margin:8px 0;overflow-wrap:anywhere}.entry[aria-current=true]{background:#e7edda;border-left:5px solid #086788}.entry small{display:block}.paper{background:#fffdf8;padding:24px;border-top:4px solid #8cbf40;min-width:0}.paper label{display:block;margin:8px 0}.wide{width:100%}.item{border-bottom:1px solid #ddd;padding:10px 0;overflow-wrap:anywhere}.item .toolbar{flex-wrap:wrap}.item span{flex:1}.done{text-decoration:line-through;color:#59645e}.muted{font-size:14px;color:#59645e}h2,h3{color:#174e52}[hidden]{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}main{padding:14px}.paper{padding:16px}}</style></head><body><header><a href="./workspace.html">← Command Central</a><h1>Lists</h1><div>Things worth keeping track of.</div></header><main><p id="status" role="status">Connecting…</p><a id="login" href="./workspace.html" hidden>Sign in</a><div id="app" hidden><div class="toolbar"><button id="new">+ New list</button><label>Workspace <select id="scope"><option value="all">Everything</option><option value="work">Work</option><option value="personal">Personal</option></select></label><label><input id="archived" type="checkbox"> Archived lists</label></div><div class="layout"><aside><input id="search" class="wide" type="search" placeholder="Find a list…" aria-label="Search lists"><div id="list"></div></aside><section id="editor" class="paper" hidden><h2 id="heading">List</h2><form id="form"><label>Name<input class="wide" name="name" required></label><div class="toolbar"><label>Type <select name="list_type"><option value="checklist">Checklist</option><option value="reference">Reference list</option><option value="reusable">Reusable checklist</option></select></label><label>Workspace <select name="workspace"><option value="personal">Personal</option><option value="work">Work</option></select></label><label><input name="pinned" type="checkbox"> Pin</label></div><label>Description (optional)<textarea class="wide" name="description"></textarea></label><div class="toolbar"><button>Save list</button><button id="archive" type="button" hidden>Archive</button></div></form><div id="related" hidden><h3>Items</h3><p id="progress" class="muted"></p><button id="reset" hidden>Reset checklist</button><div id="items"></div><form id="add" class="toolbar"><input name="title" required placeholder="Add an item…" aria-label="Item title"><button>Add</button></form></div></section></div></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://iifnugidzlgjsbfoapyy.supabase.co','sb_publishable_8IJB5S4tw4eesYAF5NNFmQ_xEepjsRf');
const $=id=>document.getElementById(id),form=$('form');let owner=null,rows=[],active=null,version=0,selection=0,busy=false,dirty=false;const check=r=>{if(r.error)throw r.error;return r.data};const status=t=>$('status').textContent=t;const el=(tag,t)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n};const types={checklist:'Checklist',reference:'Reference list',reusable:'Reusable checklist'};
function draw(){const root=$('list'),q=$('search').value.toLowerCase(),s=$('scope').value;root.replaceChildren();for(const p of rows.filter(p=>p.archived===$('archived').checked&&(s==='all'||p.workspace===s)&&p.name.toLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||a.name.localeCompare(b.name))){const b=el('button',(p.pinned?'★ ':'')+p.name);b.className='entry';b.setAttribute('aria-current',String(p.id===active));b.append(el('small',types[p.list_type]+' · '+p.workspace));b.onclick=()=>{if(!busy&&leave())open(p.id)};root.append(b)}if(!root.children.length)root.textContent='No matching lists.'}
function leave(){return !dirty||confirm('Discard unsaved list details?')}
async function load(){const v=version;const data=check(await db.from('lists').select('*').eq('user_id',owner));if(v!==version)return;rows=data;draw()}
function open(id){selection++;active=id;dirty=false;form.reset();$('add').reset();const p=rows.find(x=>x.id===id);if(p){for(const k of ['name','list_type','workspace','description'])form.elements[k].value=p[k]||'';form.elements.pinned.checked=p.pinned}else if($('scope').value==='work')form.elements.workspace.value='work';$('heading').textContent=p?.name||'New list';$('editor').hidden=false;$('related').hidden=!p;$('archive').hidden=!p;$('archive').textContent=p?.archived?'Restore':'Archive';$('reset').hidden=p?.list_type!=='reusable';$('items').replaceChildren();draw();if(p)items().catch(e=>status(e.message))}
async function action(fn){if(busy||!owner)return;busy=true;try{await fn()}catch(e){status('Request failed: '+e.message)}finally{busy=false}}
async function items(){const v=version,s=selection,id=active,p=rows.find(x=>x.id===id);if(!p)return;const data=check(await db.from('list_items').select('*').eq('list_id',id).eq('user_id',owner).order('sort_order').order('created_at'));if(v!==version||s!==selection)return;const root=$('items');root.replaceChildren();$('progress').textContent=p.list_type==='reference'?data.length+' items':data.filter(x=>x.checked).length+' of '+data.length+' checked';for(const x of data){const row=el('div');row.className='item';const bar=el('div');bar.className='toolbar';if(p.list_type!=='reference'){const c=el('input');c.type='checkbox';c.checked=x.checked;c.setAttribute('aria-label',x.title);c.onchange=()=>action(async()=>{try{check(await db.from('list_items').update({checked:c.checked}).eq('id',x.id).eq('user_id',owner));await items()}catch(e){c.checked=!c.checked;throw e}});bar.append(c)}const title=el('span',x.title);if(x.checked&&p.list_type!=='reference')title.className='done';bar.append(title);const remove=el('button','Remove');remove.onclick=()=>{if(confirm('Remove this list item?'))action(async()=>{check(await db.from('list_items').delete().eq('id',x.id).eq('user_id',owner));await items()})};bar.append(remove);row.append(bar);const d=el('details');d.append(el('summary','Item details'));const f=el('form');for(const k of ['title','notes','category','quantity','url']){const l=el('label',k==='url'?'Link':k[0].toUpperCase()+k.slice(1));const input=el(k==='notes'?'textarea':'input');input.name=k;input.className='wide';input.value=x[k]??'';if(k==='title')input.required=true;l.append(input);f.append(l)}f.append(el('button','Save item'));f.onsubmit=e=>{e.preventDefault();action(async()=>{const data=Object.fromEntries(new FormData(f));data.title=data.title.trim();if(!data.title)return;for(const k of ['notes','category','quantity','url'])data[k]=data[k].trim()||null;check(await db.from('list_items').update(data).eq('id',x.id).eq('user_id',owner));await items()})};d.append(f);row.append(d);if(x.url){try{const u=new URL(x.url);if(['https:','http:'].includes(u.protocol)){const a=el('a','Open link');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';row.append(a)}}catch{}}root.append(row)}}
form.addEventListener('input',()=>{dirty=true;status('Unsaved list details')});form.onsubmit=e=>{e.preventDefault();action(async()=>{const v=version,id=active,data=Object.fromEntries(new FormData(form));data.name=data.name.trim();if(!data.name)return;data.pinned=form.elements.pinned.checked;const p=check(await (id?db.from('lists').update(data).eq('id',id).eq('user_id',owner):db.from('lists').insert({...data,user_id:owner})).select().single());if(v!==version)return;await load();if(v!==version)return;open(p.id);status('List saved.')})};
$('new').onclick=()=>{if(!busy&&leave())open(null)};$('archive').onclick=()=>{if(!leave())return;action(async()=>{const p=rows.find(x=>x.id===active);if(!p)return;check(await db.from('lists').update({archived:!p.archived}).eq('id',p.id).eq('user_id',owner));await load();open(p.id)})};
$('add').onsubmit=e=>{e.preventDefault();action(async()=>{const title=e.target.elements.title.value.trim();if(!title||!active)return;check(await db.from('list_items').insert({title,list_id:active,user_id:owner}));e.target.reset();await items()})};
$('reset').onclick=()=>{if(confirm('Uncheck all items in this reusable checklist?'))action(async()=>{check(await db.from('list_items').update({checked:false}).eq('list_id',active).eq('user_id',owner));await items()})};
for(const id of ['search','scope','archived'])$(id).addEventListener('input',draw);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function show(session){const next=session?.user?.id||null;if(next===owner&&next)return;version++;selection++;owner=next;rows=[];active=null;dirty=false;form.reset();$('add').reset();$('list').replaceChildren();$('items').replaceChildren();$('editor').hidden=true;$('app').hidden=!owner;$('login').hidden=!!owner;status(owner?'Private workspace':'Signed out.');if(owner)load().catch(e=>status(e.message))}
db.auth.onAuthStateChange((_e,s)=>setTimeout(()=>show(s),0));
</script></body></html>
