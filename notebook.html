<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>The Notebook | The Clearing</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ed;color:#303b39;font:16px/1.6 system-ui,sans-serif}header{background:#086788;color:white;padding:24px max(20px,calc((100vw - 1100px)/2))}header h1{font:italic 40px Georgia,serif;margin:0}header a{color:white}main{max-width:1100px;margin:auto;padding:24px}button,input,select,textarea{font:inherit;padding:9px;border-radius:4px}button{background:#174e52;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}input,select,textarea{border:1px solid #87948d;background:white;color:#303b39}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #963c60;outline-offset:3px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.layout{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2.5fr);gap:24px;margin-top:20px}aside{min-width:0}aside input{width:100%}.note{display:block;width:100%;text-align:left;background:#e1edf0;color:#174e52;margin:8px 0;padding:14px;overflow-wrap:anywhere}.note[aria-current=true]{border-left:5px solid #086788;background:#e7edda}.note small{display:block;color:#46554f}.paper{background:#fffdf8;padding:24px;border-top:4px solid #8cbf40;min-width:0}.paper input[name=title]{font:28px Georgia,serif;border:0;background:transparent;width:100%;padding:8px 0}.paper textarea{width:100%;min-height:360px;resize:vertical;background:transparent;border:0;padding:12px 0;line-height:1.8}.paper label{display:block}.muted{font-size:14px;color:#59645e}[hidden]{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}main{padding:14px}.paper{padding:16px}}
</style></head><body><header><a href="./workspace.html">← Command Central</a><h1>The Notebook</h1><div>A place to think.</div></header><main><p id="status" role="status">Connecting…</p><div id="signedOut" hidden><a href="./workspace.html">Sign in to your private workspace</a></div><div id="app" hidden><div class="toolbar"><button id="new">+ New note</button><label>Workspace <select id="scope"><option value="all">Everything</option><option value="work">Work</option><option value="personal">Personal</option></select></label><label><input type="checkbox" id="archived"> Archived notes</label></div><div class="layout"><aside><input id="search" type="search" placeholder="Find a note…" aria-label="Search notes"><div id="list"></div></aside><section class="paper" id="editor" hidden><form id="form"><label class="muted">Title (optional)<input name="title" placeholder="Untitled note"></label><p class="muted" id="date"></p><label class="muted">Your notes<textarea name="content" placeholder="Start writing…"></textarea></label><div class="toolbar"><label>Workspace <select name="workspace"><option value="personal">Personal</option><option value="work">Work</option></select></label><label><input type="checkbox" name="pinned"> Pin note</label></div><p><label>Tags (optional, separated by commas)<input name="tags" style="width:100%"></label></p><div class="toolbar"><button type="submit">Save now</button><button type="button" id="archive">Archive</button><span id="saveStatus" role="status" class="muted"></span></div></form></section></div></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://iifnugidzlgjsbfoapyy.supabase.co','sb_publishable_8IJB5S4tw4eesYAF5NNFmQ_xEepjsRf');
const $=id=>document.getElementById(id), form=$('form');let owner=null, rows=[], active=null, dirty=false, timer, pending=null, version=0, busy=false;
const msg=t=>$('saveStatus').textContent=t;const check=r=>{if(r.error)throw r.error;return r.data};
function draw(){const q=$('search').value.toLowerCase(),scope=$('scope').value;const list=$('list');list.replaceChildren();for(const n of rows.filter(n=>n.archived===$('archived').checked&&(scope==='all'||n.workspace===scope)&&[n.title,n.content,...n.tags].join(' ').toLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updated_at.localeCompare(a.updated_at))){const b=document.createElement('button');b.className='note';b.setAttribute('aria-current',String(n.id===active));b.textContent=(n.pinned?'★ ':'')+(n.title||n.content.trim().split('\n')[0].slice(0,70)||'Untitled note');const small=document.createElement('small');small.textContent=n.workspace+' · '+new Date(n.updated_at).toLocaleDateString();b.append(small);b.onclick=()=>transition(()=>openNote(n.id));list.append(b)}if(!list.children.length)list.textContent='No matching notes.'}
async function load(){const v=version;const data=check(await db.from('notes').select('*').eq('user_id',owner).order('updated_at',{ascending:false}));if(v!==version)return;rows=data;draw()}
function openNote(id){const n=rows.find(x=>x.id===id);if(!n)return;active=id;dirty=false;form.elements.title.value=n.title||'';form.elements.content.value=n.content;form.elements.workspace.value=n.workspace;form.elements.pinned.checked=n.pinned;form.elements.tags.value=n.tags.join(', ');$('date').textContent='Created '+new Date(n.created_at).toLocaleDateString();$('archive').textContent=n.archived?'Restore':'Archive';$('editor').hidden=false;msg('Saved');draw()}
function snapshot(){return {title:form.elements.title.value.trim()||null,content:form.elements.content.value,workspace:form.elements.workspace.value,pinned:form.elements.pinned.checked,tags:form.elements.tags.value.split(',').map(x=>x.trim()).filter(Boolean)}}
async function save(){clearTimeout(timer);if(pending)await pending;if(!dirty||!active||!owner)return true;const id=active,v=version,user=owner,data=snapshot();dirty=false;msg('Saving…');pending=(async()=>{try{const n=check(await db.from('notes').update(data).eq('id',id).eq('user_id',user).select().single());if(v!==version)return false;rows=rows.map(x=>x.id===id?n:x);draw();msg(dirty?'Unsaved changes':'Saved');return true}catch(e){if(v===version){dirty=true;msg('Save failed — '+e.message)}return false}})();const result=await pending;pending=null;return result}
async function transition(fn){if(busy)return;busy=true;try{if(!await save()||dirty)return;await fn()}catch(e){$('status').textContent=e.message}finally{busy=false}}
form.addEventListener('input',()=>{dirty=true;msg('Unsaved changes');clearTimeout(timer);timer=setTimeout(save,900)});form.onsubmit=e=>{e.preventDefault();save()};window.addEventListener('beforeunload',e=>{if(dirty||pending){e.preventDefault();e.returnValue=''}});
$('new').onclick=()=>transition(async()=>{const v=version;const n=check(await db.from('notes').insert({user_id:owner,workspace:$('scope').value==='work'?'work':'personal'}).select().single());if(v!==version)return;rows.unshift(n);$('archived').checked=false;$('search').value='';openNote(n.id);form.elements.content.focus()});
$('archive').onclick=()=>transition(async()=>{const n=rows.find(x=>x.id===active);if(!n)return;const v=version;check(await db.from('notes').update({archived:!n.archived}).eq('id',n.id).eq('user_id',owner));if(v!==version)return;active=null;$('editor').hidden=true;form.reset();await load()});
for(const id of ['search','scope','archived'])$(id).addEventListener('input',draw);
function show(session){const next=session?.user?.id||null;if(next===owner&&next)return;version++;clearTimeout(timer);owner=next;active=null;dirty=false;rows=[];form.reset();$('list').replaceChildren();$('editor').hidden=true;$('app').hidden=!owner;$('signedOut').hidden=!!owner;$('status').textContent=owner?'Private workspace':'Signed out.';if(owner)load().catch(e=>$('status').textContent=e.message)}
db.auth.onAuthStateChange((_event,session)=>setTimeout(()=>show(session),0));
</script></body></html>
