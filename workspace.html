<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>The Clearing | Private workspace</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ed;color:#303b39;font:16px/1.6 system-ui,sans-serif}header{background:#086788;color:white;padding:24px max(20px,calc((100vw - 900px)/2))}h1{font:italic 40px Georgia,serif;margin:0}header p{margin:0}main{max-width:900px;margin:auto;padding:24px}h2,h3{color:#174e52}section{background:#fffdf8;padding:22px;margin:18px 0;border-left:5px solid #8cbf40}label{display:block}input,select,button{font:inherit;padding:9px;border-radius:4px}input,select{border:1px solid #87948d;background:white;max-width:100%}button{border:0;background:#174e52;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #963c60;outline-offset:3px}form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}form input{min-width:140px;flex:1}#login form{display:grid;max-width:380px}#login input{width:100%}.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #e3e5dd}.task span{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#59645e}.muted{color:#59645e;font-size:14px}#status{white-space:pre-wrap;color:#795640}a{color:#086788}[hidden]{display:none!important}
</style></head><body><header><h1>The Clearing</h1><p>Clarity for today. Continuity for tomorrow.</p></header><main><p><a href="./index.html">Explore the design prototype</a></p><p id="status" role="status">Connecting…</p><section id="login" hidden><h2>Welcome back</h2><p>Sign in to your private workspace.</p><form id="loginform"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="workspace" hidden><button id="logout">Sign out</button><h2>Command Central</h2><p class="muted">First connected release · use fictional test entries until access checks are complete.</p><section><h3>Tasks</h3><form id="taskform"><input name="title" aria-label="Task title" placeholder="Add a task…" required><select name="workspace" aria-label="Workspace"><option value="personal">Personal</option><option value="work">Work</option></select><button>Add</button></form><div id="tasks"></div></section><section><h3>Inbox</h3><form id="captureform"><input name="content" aria-label="Quick capture" placeholder="Capture a thought…" required><button>Capture</button></form><div id="captures"></div></section></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://iifnugidzlgjsbfoapyy.supabase.co','sb_publishable_8IJB5S4tw4eesYAF5NNFmQ_xEepjsRf');
const $=id=>document.getElementById(id);let current=null, generation=0;
function status(t){$('status').textContent=t}
function clear(){ $('tasks').replaceChildren();$('captures').replaceChildren();$('taskform').reset();$('captureform').reset(); }
function fail(e){status('Could not complete the request: '+(e?.message||'Unknown error'))}
async function load(){const g=generation;const [t,c]=await Promise.all([db.from('tasks').select('id,title,status,workspace').order('created_at'),db.from('inbox').select('id,content').eq('status','unprocessed').order('created_at')]);if(g!==generation||!current)return;if(t.error||c.error)throw t.error||c.error;$('tasks').replaceChildren();$('captures').replaceChildren();for(const task of t.data){const label=document.createElement('label');label.className='task';const check=document.createElement('input');check.type='checkbox';check.checked=task.status==='completed';const span=document.createElement('span');span.textContent=task.title;span.className=check.checked?'done':'';const tag=document.createElement('small');tag.textContent=task.workspace;label.append(check,span,tag);$('tasks').append(label);check.onchange=async()=>{check.disabled=true;try{const {error}=await db.from('tasks').update({status:check.checked?'completed':'open'}).eq('id',task.id);if(error)throw error;await load();}catch(e){check.checked=!check.checked;fail(e)}finally{check.disabled=false}}}if(!t.data.length)$('tasks').textContent='No tasks yet.';for(const item of c.data){const p=document.createElement('p');p.textContent=item.content;$('captures').append(p)}if(!c.data.length)$('captures').textContent='Nothing captured yet.';status('Connected.')}
function show(session){const next=session?.user?.id||null;if(next!==current){generation++;clear()}current=next;$('login').hidden=!!current;$('workspace').hidden=!current;if(current)load().catch(fail);else status('Signed out.')}
db.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>show(session),0)});
async function submit(form,action){const b=form.querySelector('button');b.disabled=true;try{await action(new FormData(form));}catch(e){fail(e)}finally{b.disabled=false}}
$('loginform').onsubmit=e=>{e.preventDefault();submit(e.target,async f=>{const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)throw error;e.target.reset()})};
$('logout').onclick=async()=>{try{const {error}=await db.auth.signOut();if(error)throw error;show(null)}catch(e){fail(e)}};
$('taskform').onsubmit=e=>{e.preventDefault();submit(e.target,async f=>{const title=f.get('title').trim();if(!title)return;const {error}=await db.from('tasks').insert({title,workspace:f.get('workspace')});if(error)throw error;e.target.reset();await load()})};
$('captureform').onsubmit=e=>{e.preventDefault();submit(e.target,async f=>{const content=f.get('content').trim();if(!content)return;const {error}=await db.from('inbox').insert({content});if(error)throw error;e.target.reset();await load()})};
</script></body></html>
